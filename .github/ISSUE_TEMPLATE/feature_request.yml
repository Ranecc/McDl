name: 功能建议 (Feature Request)
description: 提出新的功能或改进想法
title: '[Feature] '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！提交前请先搜索现有 issue，确认没有人提过同样的需求。
        本项目定位明确：只负责按官方版本元数据下载并校验文件，不涉及启动游戏、账号登录等职责，请据此判断建议是否在范围内。

  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 你遇到了什么场景/痛点，为什么现有功能不够用
      placeholder: 例如：内网只能通过代理访问，希望支持自定义代理地址
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望它怎么工作，最好描述界面或命令行的交互方式
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你目前是怎么绕开这个问题的，或考虑过哪些其它做法
    validations:
      required: false

  - type: dropdown
    id: pr_willing
    attributes:
      label: 是否愿意提 PR
      options:
        - 愿意，我可以自己实现
        - 愿意，但需要指导
        - 暂时没时间，只提建议
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、相关链接或其它上下文
    validations:
      required: false
