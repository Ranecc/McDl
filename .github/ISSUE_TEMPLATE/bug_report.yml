name: 问题报告 (Bug)
description: 报告 McDl 在下载、安装或运行过程中出现的异常
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量把信息填完整，这能大幅加快定位问题的速度。
        注意事项：
        - 提交前请先搜索现有 issue，避免重复。
        - 一般性的使用问题请先看 README，不要占用 issue 区。
        - 粘贴日志或截图前，请先删掉个人目录、账号等敏感信息。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，确认这不是重复问题
          required: true
        - label: 我已阅读 README 中的「快速开始」和「免责声明」
          required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 用一两句话说明发生了什么
      placeholder: 例如：安装 1.20.1 时卡在资源文件阶段，日志反复重试同一个文件
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步步写清楚怎么触发，越具体越好
      placeholder: |
        1. 双击运行 McDl.exe
        2. 左侧选择版本 1.20.1
        3. 安装目录保持默认，线程数 8
        4. 点击「开始安装」，等待约 3 分钟
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 例如：全部文件下载完成并通过 SHA1 校验
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 包括报错文案、进度是否卡住、是否有文件残留等
    validations:
      required: true

  - type: input
    id: mcdl_version
    attributes:
      label: McDl 版本
      description: 发布压缩包的版本号，或界面/日志中显示的版本
      placeholder: 例如 0.1.0
    validations:
      required: true

  - type: input
    id: game_version
    attributes:
      label: 游戏版本
      description: 出问题的是哪个 Minecraft 版本
      placeholder: 例如 1.21.4、1.6.4、26.3
    validations:
      required: true

  - type: input
    id: windows_version
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 23H2（内部版本 22631）
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: 系统位数
      options:
        - 64 位
        - 32 位
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: entry
    attributes:
      label: 使用的入口
      options:
        - 图形界面 (McDl.exe)
        - 命令行 (mcdl.exe)
        - 两者都有
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 粘贴界面日志区的完整内容，或命令行输出
      render: text
      placeholder: |
        2026-10-20 12:00:00 [INFO] ...
        2026-10-20 12:00:05 [WARN] ...
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: 附件说明
      description: 需要提供截图/录屏时，请先把文件拖进下方评论框，再在这里说明每张图的内容
    validations:
      required: false
