version: 2

# 依赖更新策略：每周检查一次，只提 PR 不自动合并。
updates:
  # NuGet：项目在 Directory.Build.props 与各 csproj 中声明 PackageReference
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  # GitHub Actions：保持 workflow 里用到的 action 版本不过期
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
